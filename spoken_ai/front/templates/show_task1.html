<!-- templates/show_task1.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{{ task.name }}</title>

    <style>
        :root{
            --bg: #f3f5f7;            /* 冷灰背景 */
            --card: #ffffff;
            --border: #e6e9ee;
            --text: #1f2d3d;
            --muted: #667085;
            --primary: #1b4f9c;       /* ETS-like blue */
            --primary-2: #2f6fd6;
            --reading-bg: #f6f8fb;    /* 阅读框 */
            --shadow: 0 8px 24px rgba(16,24,40,0.06);
            --radius: 14px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            line-height: 1.75;
            padding: 34px 18px;
        }

        /* 页面主体容器：营造“考试界面” */
        .toefl-shell{
            max-width: 980px;
            margin: 0 auto;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 26px 26px 18px;
        }

        /* 顶部标题：更像考试标题栏 */
        h1 {
            margin: 0 0 14px;
            font-size: 26px;
            color: var(--primary);
            letter-spacing: 0.2px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .section { margin: 18px 0; }

        .section h2 {
            color: #0f172a;
            font-size: 18px;
            margin: 0 0 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 小标题前的蓝色竖条：ETS/考试常见信息提示感 */
        .section h2::before{
            content:"";
            width: 6px;
            height: 18px;
            border-radius: 999px;
            background: var(--primary-2);
            display: inline-block;
        }

        /* 阅读文本：考试阅读框样式 */
        .reading-box{
            background: var(--reading-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            position: relative;
        }
        .reading-box::before{
            content:"Reading";
            position: absolute;
            top: -10px;
            left: 14px;
            background: var(--card);
            padding: 0 10px;
            font-size: 12px;
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 999px;
            line-height: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* 默认段落/textarea 不再强制灰底（灰底由 reading-box/instruction 控制） */
        .section p, .section textarea {
            background: transparent;
            padding: 0;
            border-left: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            width: 100%;
            margin: 0;
        }

        /* 录音区提示：更像考试 instructions */
        .instruction{
            background: #f8fbff;
            border: 1px solid #dbeafe;
            border-radius: 12px;
            padding: 12px 14px;
            color: #0b3b7a;
        }

        textarea {
            border: 1px solid var(--border);
            border-radius: 12px;
            resize: vertical;
            min-height: 120px;
            padding: 12px 12px;
            background: #fff;
            box-shadow: 0 1px 0 rgba(16,24,40,0.02);
        }

        .hidden { display: none; }

        /* 按钮：克制的 ETS 风格 */
        .btn {
            padding: 10px 16px;
            margin: 6px 8px 6px 0;
            background: var(--primary);
            color: white;
            border: 1px solid rgba(0,0,0,0.02);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 0.2px;
            box-shadow: 0 2px 8px rgba(27,79,156,0.18);
            transition: transform .05s ease, background .15s ease;
        }
        .btn:hover { background: #163f7a; }
        .btn:active { transform: translateY(1px); }

        .btn-secondary {
            background: #f2f4f7;
            color: #344054;
            border: 1px solid var(--border);
            box-shadow: none;
        }
        .btn-secondary:hover { background: #e9edf2; }

        /* 计时器更像考试：右侧胶囊 */
        .timer {
            font-weight: 700;
            color: #b42318;
            background: #fff1f0;
            border: 1px solid #ffd6d1;
            padding: 6px 10px;
            border-radius: 999px;
            margin-left: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* 评分展示样式（保持原结构，仅统一风格） */
        .score-row { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0 0; }
        .score-badge {
            background: #eef4ff;
            border: 1px solid #d6e4ff;
            color: #193b7a;
            padding: 8px 10px;
            border-radius: 10px;
            font-weight: 700;
        }
        .dim-card {
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px;
            margin: 12px 0;
            background: #fff;
            box-shadow: 0 2px 10px rgba(16,24,40,0.04);
        }
        .dim-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .dim-title h3 { margin: 0; color: #0f172a; font-size: 17px; }
        .dim-score {
            background: #fff7ed;
            border: 1px solid #fed7aa;
            color: #9a3412;
            padding: 4px 10px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 12px;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid var(--border); padding: 10px; vertical-align: top; }
        th { background: #f8fafc; color: #0f172a; text-align: left; }

        .mini-note { color: var(--muted); font-size: 13px; margin-top: 6px; }
        .list { margin: 8px 0 0 18px; }
        .list li { margin: 6px 0; }

        /* back 链接区域不强改（你说后面返回不用调整） */
        .back { display: inline-block; margin-top: 20px; color: #7f8c8d; text-decoration: none; }
        .back:hover { text-decoration: underline; }
    </style>
</head>

<body>
<div class="toefl-shell">
    <h1>{{ task.name }}</h1>

    <!-- 1. 题目（始终显示） -->
    <div class="section">
        <h2>阅读文本</h2>
        <div class="reading-box">
            <p>{{ task.readingtext|default:"无" }}</p>
        </div>
    </div>

    <!-- 2. 录音区域 -->
    <div class="section" id="recordSection">
        <h2>请回答（45秒）</h2>
        <div class="instruction">点击“开始录音”后，你有 45 秒时间回答。</div>
        <div style="margin-top: 10px;">
            <button id="startBtn" class="btn">开始录音</button>
            <span id="timer" class="timer hidden">剩余: <span id="countdown">45</span> 秒</span>
            <button id="stopBtn" class="btn btn-secondary hidden">提前结束</button>
        </div>
        <div id="recordStatus" style="margin-top: 10px;"></div>
    </div>

    <!-- 3. 转写文本编辑区（初始隐藏） -->
    <div class="section hidden" id="editSection">
        <h2>你的回答（可编辑）</h2>
        <textarea id="transcriptionText" placeholder="语音转写结果将显示在这里..."></textarea>
        <br>
        <button id="confirmBtn" class="btn">确认最终答案并生成报告</button>
    </div>

    <!-- 4. AI 反馈 + PDF 下载（初始隐藏） -->
    <div class="section hidden" id="feedbackSection">
        <h2>AI 评分报告</h2>
        <div id="feedbackContent"></div>
        <br>
        <a id="pdfLink" target="_blank" style="display:none;">📥 下载 PDF 报告</a>
        <button id="followupBtn" class="btn btn-secondary hidden">进入追问与精讲</button>
    </div>

    <!-- 5. 显示参考答案按钮 -->
    <div class="section">
        <button id="toggleAnswersBtn" class="btn btn-secondary">显示参考答案与解题思路</button>
    </div>

    <!-- 6. 参考答案区域（初始隐藏） -->
    <div class="section hidden" id="answersSection">
        <h2>参考答案1</h2>
        <p>{{ task.answertext1|default:"无" }}</p>
        <h2>参考答案2</h2>
        <p>{{ task.answertext2|default:"无" }}</p>
        <h2>解题思路</h2>
        <p>{{ task.reasontext|default:"无" }}</p>
    </div>

    <!-- 后面的返回显示不调整 -->
    <a href="{% url 'spoken_ai:task1_list' %}" class="back">← 返回任务列表</a>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let countdownInterval = null;
        const task_id = {{ task.id }};

        document.getElementById('startBtn').addEventListener('click', startRecording);
        document.getElementById('stopBtn').addEventListener('click', stopRecording);
        document.getElementById('confirmBtn').addEventListener('click', confirmAnswer);
        document.getElementById('toggleAnswersBtn').addEventListener('click', toggleAnswers);

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function safeArray(x) {
            if (!x) return [];
            return Array.isArray(x) ? x : [x];
        }

        function prettyDimName(dim) {
            const map = {
                delivery: "Delivery（表达）",
                language_use: "Language Use（语言）",
                topic_development: "Topic Development（内容）"
            };
            return map[dim] || dim;
        }

        function renderDimensionFeedback(dimKey, dimObj) {
            const score = dimObj?.score ?? 'N/A';
            const problems = safeArray(dimObj?.problems);
            const evidence = safeArray(dimObj?.evidence);
            const fixes = safeArray(dimObj?.fixes);

            const maxLen = Math.max(problems.length, evidence.length, fixes.length, 1);

            let rows = '';
            for (let i = 0; i < maxLen; i++) {
                rows += `
                    <tr>
                        <td>${escapeHtml(problems[i] ?? '')}</td>
                        <td>${escapeHtml(evidence[i] ?? '')}</td>
                        <td>${escapeHtml(fixes[i] ?? '')}</td>
                    </tr>
                `;
            }

            return `
                <div class="dim-card">
                    <div class="dim-title">
                        <h3>${escapeHtml(prettyDimName(dimKey))}</h3>
                        <span class="dim-score">Score: ${escapeHtml(score)}</span>
                    </div>
                    <div class="mini-note">每条建议都对应「问题 → 证据 → 改进」；即使高分也会给高级优化点。</div>
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 34%;">Problems / Improvements</th>
                                <th style="width: 33%;">Evidence（证据）</th>
                                <th style="width: 33%;">Fixes（怎么改）</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderWordsTable(items, title) {
            const arr = safeArray(items);
            let rows = '';
            arr.forEach(it => {
                rows += `
                    <tr>
                        <td>${escapeHtml(it?.en ?? '')}</td>
                        <td>${escapeHtml(it?.zh ?? '')}</td>
                    </tr>
                `;
            });

            return `
                <div class="dim-card">
                    <div class="dim-title">
                        <h3>${escapeHtml(title)}</h3>
                    </div>
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 35%;">English</th>
                                <th>中文释义</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows || `<tr><td colspan="2">无</td></tr>`}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function renderSentences(items) {
            const arr = safeArray(items);
            const lis = arr.map(s => `<li>${escapeHtml(s)}</li>`).join('');
            return `
                <div class="dim-card">
                    <div class="dim-title">
                        <h3>Recommended Sentences（推荐句子）</h3>
                    </div>
                    <ol class="list">
                        ${lis || '<li>无</li>'}
                    </ol>
                    <div class="mini-note">（按你的 prompt：每句尽量包含至少一个推荐短语，且不超过 22 词）</div>
                </div>
            `;
        }

        // ✅ 新增：优秀改写答案（correction）
        function normalizeCorrection(correction) {
            if (correction === null || correction === undefined) return '';
            if (typeof correction === 'string') return correction;
            // 兼容对象：常见字段名
            if (typeof correction === 'object') {
                return (correction.text || correction.answer || correction.content || JSON.stringify(correction)) + '';
            }
            return String(correction);
        }

        function renderCorrection(correction) {
            const text = normalizeCorrection(correction).trim();
            return `
                <div class="dim-card">
                    <div class="dim-title">
                        <h3>Correction（改写后优秀答案）</h3>
                    </div>
                    <p style="background:#f9f9f9;padding:12px;border-left:4px solid #2ecc71;white-space:pre-wrap;word-wrap:break-word;margin-top:10px;">
                        ${escapeHtml(text || '无')}
                    </p>
                    <div class="mini-note">基于你的回答做更地道、更高分的改写版本（可直接背诵/复述）。</div>
                </div>
            `;
        }

        function buildFollowupText(feedback) {
            const df = feedback?.dimension_feedback || {};
            const dims = ["delivery", "language_use", "topic_development"];

            let issues = [];
            let reasons = [];

            dims.forEach(dim => {
                const problems = safeArray(df?.[dim]?.problems);
                const fixes = safeArray(df?.[dim]?.fixes);

                problems.slice(0, 2).forEach(p => issues.push(`[${prettyDimName(dim)}] ${p}`));
                fixes.slice(0, 2).forEach(f => reasons.push(`[${prettyDimName(dim)}] ${f}`));
            });

            // ✅ 把 correction 带到 followup（沿用 answer 参数）
            const correctionText = normalizeCorrection(feedback?.correction).trim();

            return {
                issues: issues.join('\n'),
                reason: reasons.join('\n'),
                answer: correctionText || ''
            };
        }

        function renderFeedback(feedback) {
            if (!feedback || typeof feedback !== 'object') {
                return `<p>反馈格式异常：无法解析。</p>`;
            }

            const overall = feedback.overall_score ?? 'N/A';
            const ds = feedback.dimension_scores || {};
            const df = feedback.dimension_feedback || {};

            let html = `
                <div class="score-row">
                    <div class="score-badge">Overall Score: ${escapeHtml(overall)}</div>
                    <div class="score-badge">Delivery: ${escapeHtml(ds.delivery ?? 'N/A')}</div>
                    <div class="score-badge">Language Use: ${escapeHtml(ds.language_use ?? 'N/A')}</div>
                    <div class="score-badge">Topic Dev: ${escapeHtml(ds.topic_development ?? 'N/A')}</div>
                </div>
            `;

            ["delivery", "language_use", "topic_development"].forEach(dim => {
                html += renderDimensionFeedback(dim, df?.[dim] || {});
            });

            // ✅ 新增：优秀改写答案展示（放在三维度之后、词汇短语之前）
            if (feedback.correction !== undefined && feedback.correction !== null) {
                html += renderCorrection(feedback.correction);
            }

            html += renderWordsTable(feedback.recommended_words, "Recommended Words（推荐词汇）");
            html += renderWordsTable(feedback.recommended_phrases, "Recommended Phrases（推荐短语）");
            html += renderSentences(feedback.recommended_sentences);

            return html;
        }

        function startRecording() {
            navigator.mediaDevices.getUserMedia({ audio: true })
                .then(stream => {
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        uploadAudio(audioBlob);
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    document.getElementById('startBtn').classList.add('hidden');
                    document.getElementById('timer').classList.remove('hidden');
                    document.getElementById('stopBtn').classList.remove('hidden');
                    document.getElementById('recordStatus').innerText = '正在录音...';

                    let timeLeft = 45;
                    document.getElementById('countdown').innerText = timeLeft;
                    countdownInterval = setInterval(() => {
                        timeLeft--;
                        document.getElementById('countdown').innerText = timeLeft;
                        if (timeLeft <= 0) {
                            stopRecording();
                        }
                    }, 1000);
                })
                .catch(err => {
                    document.getElementById('recordStatus').innerText = '录音失败: ' + err.message;
                });
        }

        function stopRecording() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        function uploadAudio(blob) {
            const formData = new FormData();
            formData.append('audio', blob, 'answer.webm');

            fetch(`process_task_audio/`, {
                method: 'POST',
                body: formData,
                headers: { 'X-CSRFToken': '{{ csrf_token }}' }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('transcriptionText').value = data.transcription;
                    document.getElementById('editSection').classList.remove('hidden');
                    document.getElementById('recordSection').classList.add('hidden');
                } else {
                    alert('语音处理失败: ' + data.error);
                }
            })
            .catch(err => {
                console.error(err);
                alert('上传失败');
            });
        }

        function confirmAnswer() {
            const finalText = document.getElementById('transcriptionText').value.trim();
            if (!finalText) {
                alert('请输入你的回答');
                return;
            }

            fetch(`analyse_task1/`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ student_answer: finalText })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const feedback = data.feedback || {};
                    document.getElementById('feedbackContent').innerHTML = renderFeedback(feedback);

                    if (data.pdf_url) {
                        const link = document.getElementById('pdfLink');
                        link.href = data.pdf_url;
                        link.style.display = 'inline';
                    } else {
                        document.getElementById('pdfLink').style.display = 'none';
                    }

                    document.getElementById('feedbackSection').classList.remove('hidden');

                    const followupBtn = document.getElementById('followupBtn');
                    followupBtn.classList.remove('hidden');

                    followupBtn.onclick = function () {
                        const baseUrl = "{% url 'spoken_ai:followup' %}";
                        const pack = buildFollowupText(feedback);

                        const params = new URLSearchParams({
                            task_name: "{{ task.name|default:''|escapejs }}",
                            readingtext: "{{ task.readingtext|default:''|escapejs }}",
                            student_answer: finalText,
                            issues: pack.issues || '',
                            reason: pack.reason || '',
                            // ✅ answer 参数承载 correction（优秀改写答案）
                            answer: pack.answer || ''
                        });

                        window.location.href = baseUrl + "?" + params.toString();
                    };
                } else {
                    alert('分析失败: ' + data.error);
                }
            })
            .catch(err => {
                console.error(err);
                alert('提交失败');
            });
        }

        function toggleAnswers() {
            const answersSection = document.getElementById('answersSection');
            const toggleBtn = document.getElementById('toggleAnswersBtn');

            if (answersSection.classList.contains('hidden')) {
                answersSection.classList.remove('hidden');
                toggleBtn.textContent = '隐藏参考答案与解题思路';
            } else {
                answersSection.classList.add('hidden');
                toggleBtn.textContent = '显示参考答案与解题思路';
            }
        }
    </script>
</div>
</body>
</html>
