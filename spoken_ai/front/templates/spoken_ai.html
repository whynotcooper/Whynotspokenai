<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>语音对话助手</title>

  <style>
    :root{
      --bg: #f5f6f7;
      --card: #ffffff;
      --stroke: rgba(15, 23, 42, .10);

      --text: #0f172a;
      --muted: rgba(15, 23, 42, .60);

      --shadow: 0 22px 60px rgba(15, 23, 42, .10);
      --shadow2: 0 10px 24px rgba(15, 23, 42, .08);

      --radius: 22px;

      /* 黑白配：用户黑、系统浅灰 */
      --bubbleUserBg: #0b0f19;
      --bubbleUserText: #ffffff;
      --bubbleSysBg: #f1f3f5;
      --bubbleSysText: #111827;

      --btnPrimaryBg: #0b0f19;
      --btnPrimaryText: #ffffff;

      --btnGhostBg: #ffffff;
      --btnGhostText: #0b0f19;

      --dangerBg: #ffffff;
      --dangerText: #b42318;
      --dangerStroke: rgba(180,35,24,.25);

      --ok: #16a34a;
      --warn: #f59e0b;
      --err: #ef4444;
    }

    *{ box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans";
      background: radial-gradient(1200px 800px at 20% 0%, rgba(0,0,0,.06), transparent 55%),
                  radial-gradient(1200px 800px at 90% 20%, rgba(0,0,0,.04), transparent 55%),
                  var(--bg);
      color: var(--text);
    }

    .wrap{
      max-width: 1200px;
      margin: 28px auto;
      padding: 0 18px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap: 12px;
    }

    .logo{
      width: 44px;
      height: 44px;
      border-radius: 16px;
      background: linear-gradient(135deg, #111827, #334155);
      box-shadow: 0 10px 22px rgba(0,0,0,.10);
      position: relative;
      overflow:hidden;
    }
    .logo:after{
      content:"";
      position:absolute;
      inset:-50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.35), transparent 55%);
      transform: rotate(20deg);
    }

    .title h1{
      margin: 0;
      font-size: 18px;
      font-weight: 750;
      letter-spacing: .2px;
    }
    .title p{
      margin: 3px 0 0;
      font-size: 13px;
      color: var(--muted);
    }

    .status-pill{
      display:flex;
      align-items:center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      border: 1px solid var(--stroke);
      box-shadow: 0 8px 18px rgba(15, 23, 42, .06);
      font-size: 12px;
      color: rgba(15,23,42,.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .status-indicator{
      width: 10px; height: 10px;
      border-radius: 999px;
      background: rgba(0,0,0,.20);
    }
    .status-connecting{ background: var(--warn); }
    .status-success{ background: var(--ok); }
    .status-error{ background: var(--err); }

    .container{
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      overflow:hidden;
    }

    .main{
      display:grid;
      grid-template-columns: 1.6fr .8fr;
    }
    @media (max-width: 980px){
      .main{ grid-template-columns: 1fr; }
    }

    .chat-area{
      padding: 18px;
      border-right: 1px solid rgba(15,23,42,.08);
      background: linear-gradient(180deg, rgba(0,0,0,.02), transparent);
    }
    @media (max-width: 980px){
      .chat-area{
        border-right:none;
        border-bottom: 1px solid rgba(15,23,42,.08);
      }
    }

    .chat-box{
      height: 640px;
      overflow:auto;
      padding: 16px;
      background: #ffffff;
      border: 1px solid rgba(15,23,42,.12);
      border-radius: 20px;
      display:flex;
      flex-direction:column;
      gap: 12px;
    }
    @media (max-width: 980px){
      .chat-box{ height: 560px; }
    }

    .chat-box::-webkit-scrollbar{ width: 10px; }
    .chat-box::-webkit-scrollbar-thumb{
      background: rgba(15,23,42,.18);
      border-radius: 999px;
      border: 2px solid #ffffff;
      background-clip: padding-box;
    }

    .msg{
      max-width: 78%;
      padding: 11px 12px;
      border-radius: 18px;
      box-shadow: var(--shadow2);
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
    }

    .user-msg{
      align-self:flex-end;
      margin-left:auto;
      background: var(--bubbleUserBg);
      color: var(--bubbleUserText);
    }

    .system-msg{
      align-self:flex-start;
      margin-right:auto;
      background: var(--bubbleSysBg);
      color: var(--bubbleSysText);
    }

    .meta{
      margin-top: 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .pill{
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(15,23,42,.03);
      border: 1px solid rgba(15,23,42,.10);
      font-variant-numeric: tabular-nums;
    }
    #timer{
      font-size: 14px;
      letter-spacing: .5px;
    }

    .controls{
      padding: 18px;
      display:flex;
      flex-direction:column;
      gap: 12px;
      background: #fafafa;
    }

    .panel{
      border-radius: 20px;
      background: #ffffff;
      border: 1px solid rgba(15,23,42,.10);
      box-shadow: 0 10px 26px rgba(15,23,42,.06);
      padding: 14px;
    }
    .panel h3{
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .2px;
      color: rgba(15,23,42,.85);
    }
    .panel p{
      margin: 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .btn-row{
      display:flex;
      gap: 10px;
      margin-top: 10px;
    }

    .btn{
      appearance:none;
      width: 100%;
      border-radius: 14px;
      padding: 11px 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid rgba(15,23,42,.14);
      transition: transform .06s ease, box-shadow .2s ease, background .2s ease, opacity .2s ease;
      user-select:none;
    }
    .btn:active{ transform: translateY(1px); }
    .btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }

    .btn-primary{
      background: var(--btnPrimaryBg);
      color: var(--btnPrimaryText);
      border-color: rgba(0,0,0,.25);
      box-shadow: 0 14px 30px rgba(0,0,0,.15);
    }
    .btn-primary:hover{ box-shadow: 0 16px 36px rgba(0,0,0,.18); }

    .btn-ghost{
      background: var(--btnGhostBg);
      color: var(--btnGhostText);
    }
    .btn-ghost:hover{ background: rgba(15,23,42,.03); }

    .btn-danger{
      background: var(--dangerBg);
      color: var(--dangerText);
      border: 1px solid var(--dangerStroke);
    }
    .btn-danger:hover{ background: rgba(180,35,24,.04); }

    .system-audio-container{
      margin-top: 0;
      padding: 10px 12px;
      border-radius: 18px;
      background: rgba(15,23,42,.03);
      border: 1px solid rgba(15,23,42,.10);
      max-width: 78%;
      align-self:flex-start;
    }
    .system-audio-container p{
      margin: 0 0 6px 0;
      font-size: 12px;
      color: rgba(15,23,42,.70);
      font-weight: 750;
    }
    audio.audio-player{ width: 100%; height: 34px; }

    .debug-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .tiny{ font-size: 12px; color: rgba(15,23,42,.55); }
    .debug-content{
      max-height: 180px;
      overflow:auto;
      border-radius: 14px;
      padding: 10px;
      background: rgba(15,23,42,.03);
      border: 1px solid rgba(15,23,42,.08);
      display:none;
    }
    .debug-content.show{ display:block; }
    .debug-content div{
      margin: 6px 0;
      font-size: 12px;
      color: rgba(15,23,42,.78);
    }

    /* === 文字折叠：只折叠“系统文字”，用户文字直接显示 === */
    .text-toggle{
      display:none;
      margin-top: 8px;
    }
    .btn-mini{
      width:auto;
      padding: 8px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
      border: 1px solid rgba(15,23,42,.14);
      background: #ffffff;
      color: #0b0f19;
      align-self:flex-start;
    }
    .btn-mini:hover{ background: rgba(15,23,42,.03); }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div class="title">
          <h1>语音对话助手</h1>
          <p>默认显示：用户文字 + 音频；可选择展开系统文字</p>
        </div>
      </div>

      <div class="status-pill" id="debug-status">
        <span class="status-indicator"></span>
        就绪
      </div>
    </div>

    <div class="container">
      <div class="main">
        <section class="chat-area">
          <div class="chat-box" id="chat-box"></div>
          <div class="meta">
            <span class="pill">Session Timer</span>
            <span class="pill" id="timer">00:00:00</span>
          </div>
        </section>

        <aside class="controls">
          <div class="panel">
            <h3>录音控制</h3>
            <p>开始录音后说话，停止录音会自动上传并显示：用户文字 + 语音回复（系统文字可展开）。</p>

            <div class="btn-row">
              <button class="btn btn-primary" id="start-recording">开始录音</button>
              <button class="btn btn-ghost" id="stop-recording" disabled>停止</button>
            </div>

            <div style="height:10px"></div>

            <button class="btn btn-danger" id="finish-btn">结束对话并生成报告</button>
            <div style="height:10px"></div>
            <button class="btn btn-ghost" id="download-btn" style="display:none;">下载报告</button>
          </div>

          <div class="panel" id="debug-info">
            <div class="debug-head">
              <div>
                <h3 style="margin:0;">调试信息</h3>
                <div class="tiny">默认折叠（产品观感更干净）</div>
              </div>
              <button class="btn btn-ghost" id="toggle-debug" style="width:auto; padding:9px 11px;">
                展开
              </button>
            </div>
            <div class="debug-content" id="debug-content"></div>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const startRecordingBtn = document.getElementById('start-recording');
    const stopRecordingBtn = document.getElementById('stop-recording');
    const finishBtn = document.getElementById('finish-btn');
    const downloadBtn = document.getElementById('download-btn');
    const timerDisplay = document.getElementById('timer');
    const debugContent = document.getElementById('debug-content');
    const debugStatus = document.getElementById('debug-status');
    const toggleDebugBtn = document.getElementById('toggle-debug');

    let mediaRecorder;
    let audioChunks = [];
    let conversation = [];
    let timer;
    let startTime;

    // Debug 折叠
    toggleDebugBtn.addEventListener('click', () => {
      debugContent.classList.toggle('show');
      toggleDebugBtn.textContent = debugContent.classList.contains('show') ? '收起' : '展开';
    });

    // 添加调试信息
    function addDebugMessage(message, type = 'info') {
      const timestamp = new Date().toLocaleTimeString();
      const messageElement = document.createElement('div');
      messageElement.innerHTML = `<strong>${timestamp}</strong>: ${message}`;
      if (type === 'error') messageElement.style.color = '#b42318';
      if (type === 'success') messageElement.style.color = '#166534';
      debugContent.appendChild(messageElement);
      debugContent.scrollTop = debugContent.scrollHeight;
    }

    // 更新状态
    function updateStatus(status) {
      debugStatus.innerHTML = '';
      const indicator = document.createElement('span');
      indicator.classList.add('status-indicator');

      if (status === 'connecting') {
        indicator.classList.add('status-connecting');
        debugStatus.appendChild(indicator);
        debugStatus.appendChild(document.createTextNode('连接中...'));
      } else if (status === 'success') {
        indicator.classList.add('status-success');
        debugStatus.appendChild(indicator);
        debugStatus.appendChild(document.createTextNode('成功'));
      } else if (status === 'error') {
        indicator.classList.add('status-error');
        debugStatus.appendChild(indicator);
        debugStatus.appendChild(document.createTextNode('错误'));
      } else {
        debugStatus.appendChild(indicator);
        debugStatus.appendChild(document.createTextNode('就绪'));
      }
    }

    // === 新增：只折叠“系统文字”，用户文字直接显示 ===
    function createSystemTextToggle({ shortReply }) {
      const wrapper = document.createElement('div');
      wrapper.style.display = 'flex';
      wrapper.style.flexDirection = 'column';
      wrapper.style.gap = '8px';
      wrapper.style.maxWidth = '78%';
      wrapper.style.alignSelf = 'flex-start';

      const toggleBtn = document.createElement('button');
      toggleBtn.className = 'btn-mini';
      toggleBtn.textContent = '查看系统文字';

      const textBox = document.createElement('div');
      textBox.className = 'text-toggle';

      const sysText = document.createElement('div');
      sysText.classList.add('msg', 'system-msg');
      sysText.textContent = shortReply;

      textBox.appendChild(sysText);

      toggleBtn.addEventListener('click', () => {
        const isHidden = textBox.style.display === 'none' || textBox.style.display === '';
        textBox.style.display = isHidden ? 'block' : 'none';
        toggleBtn.textContent = isHidden ? '隐藏系统文字' : '查看系统文字';
      });

      wrapper.appendChild(toggleBtn);
      wrapper.appendChild(textBox);
      return wrapper;
    }

    // 请求麦克风权限并开始录音
    startRecordingBtn.addEventListener('click', async () => {
      try {
        addDebugMessage('请求麦克风权限...');
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        addDebugMessage('麦克风权限获取成功', 'success');

        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = event => {
          audioChunks.push(event.data);
          addDebugMessage(`收到音频数据块，大小: ${event.data.size} 字节`);
        };

        mediaRecorder.onstop = async () => {
          addDebugMessage('录音停止，开始处理音频');
          const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
          addDebugMessage(`音频Blob创建完成，大小: ${audioBlob.size} 字节`);

          // 占位：先显示用户气泡（稍后替换成转写）
          const userMsg = document.createElement('div');
          userMsg.classList.add('msg', 'user-msg');
          userMsg.textContent = '正在识别...';
          chatBox.appendChild(userMsg);
          chatBox.scrollTop = chatBox.scrollHeight;

          const formData = new FormData();
          formData.append('audio', audioBlob, 'recording.wav');

          try {
            updateStatus('connecting');
            addDebugMessage('开始上传音频到服务器...');

            const response = await fetch('/process_audio/', {
              method: 'POST',
              body: formData
            });

            addDebugMessage(`服务器响应状态: ${response.status} ${response.statusText}`);

            if (!response.ok) {
              throw new Error(`网络响应异常: ${response.status} ${response.statusText}`);
            }

            const responseText = await response.text();
            addDebugMessage(`收到服务器响应: ${responseText}`);

            let data;
            try {
              data = JSON.parse(responseText);
              updateStatus('success');
              addDebugMessage('JSON解析成功', 'success');
            } catch (e) {
              throw new Error(`JSON解析失败: ${e.message}`);
            }

            if (data.error) {
              throw new Error(`服务器返回错误: ${data.error}`);
            }

            const shortReply = data.short_reply || '[无回复]';
            const transcription = data.transcription || '[语音识别失败]';
            const audioReplyUrl = data.audio_reply_url || '';

            addDebugMessage(`识别结果: ${transcription}`, 'success');
            addDebugMessage(`系统回复: ${shortReply}`, 'success');

            // ✅ 用户文字：直接显示（更新占位气泡）
            userMsg.textContent = transcription;

            // 音频播放器（直接显示）
            if (audioReplyUrl) {
              const audioContainer = document.createElement('div');
              audioContainer.classList.add('system-audio-container');

              const audioLabel = document.createElement('p');
              audioLabel.textContent = '语音回复';
              audioContainer.appendChild(audioLabel);

              const audioPlayer = document.createElement('audio');
              audioPlayer.classList.add('audio-player');
              audioPlayer.controls = true;
              audioPlayer.src = audioReplyUrl;

              // 尝试自动播放（可能被浏览器策略拦截）
              audioPlayer.autoplay = true;

              audioPlayer.addEventListener('loadeddata', () => {
                addDebugMessage('音频加载成功', 'success');
              });
              audioPlayer.addEventListener('error', () => {
                addDebugMessage('音频加载失败', 'error');
              });

              audioContainer.appendChild(audioPlayer);
              chatBox.appendChild(audioContainer);
            }

            // ✅ 系统文字：默认隐藏，可选择展开
            const sysToggle = createSystemTextToggle({ shortReply });
            chatBox.appendChild(sysToggle);

            // 保存对话内容（生成报告用）
            conversation.push({
              user: transcription,
              system: shortReply,
              audio_reply_url: audioReplyUrl
            });

            chatBox.scrollTop = chatBox.scrollHeight;
          } catch (error) {
            console.error('Error:', error);
            updateStatus('error');
            addDebugMessage(`处理失败: ${error.message}`, 'error');
            userMsg.textContent = '[识别或上传失败]';
          }

          audioChunks = [];
        };

        mediaRecorder.start();
        addDebugMessage('录音开始');
        updateStatus('connecting');

        startRecordingBtn.disabled = true;
        stopRecordingBtn.disabled = false;

        startTime = Date.now();
        timer = setInterval(() => {
          const elapsed = Math.floor((Date.now() - startTime) / 1000);
          const hours = Math.floor(elapsed / 3600);
          const minutes = Math.floor((elapsed % 3600) / 60);
          const seconds = elapsed % 60;
          timerDisplay.textContent = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }, 1000);

      } catch (error) {
        console.error('Error accessing microphone:', error);
        updateStatus('error');
        addDebugMessage(`无法访问麦克风: ${error.message}`, 'error');
        alert('无法访问麦克风，请检查权限或设备');
      }
    });

    // 停止录音
    stopRecordingBtn.addEventListener('click', () => {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        addDebugMessage('手动停止录音');
      }
      updateStatus('success');

      startRecordingBtn.disabled = false;
      stopRecordingBtn.disabled = true;

      clearInterval(timer);
      timerDisplay.textContent = '00:00:00';
    });

    // 结束对话
    finishBtn.addEventListener('click', async () => {
      finishBtn.disabled = true;
      addDebugMessage('结束对话，生成报告...');

      try {
        const response = await fetch('/finish_session/', {
          method: 'POST',
          body: JSON.stringify({ conversation }),
          headers: { 'Content-Type': 'application/json' }
        });

        if (!response.ok) throw new Error('生成报告失败');

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'spoken_report.pdf';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        addDebugMessage('报告生成成功', 'success');
        downloadBtn.style.display = 'block';

        chatBox.innerHTML = '';
        conversation = [];
      } catch (error) {
        console.error('Error:', error);
        addDebugMessage(`报告生成失败: ${error.message}`, 'error');
        alert('报告生成失败，请重试');
      } finally {
        finishBtn.disabled = false;
      }
    });

    // 下载报告（备用方式）
    downloadBtn.addEventListener('click', () => {
      addDebugMessage('使用备用方式下载报告');
      window.location.href = '/download_report/';
    });

    addDebugMessage('页面加载完成，准备就绪');
    updateStatus('idle');
  </script>
</body>
</html>
